name: Render Deployment Notification

on:
  push:
    branches:
      - dev

jobs:
  monitor-render-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Render deployment
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for Render deployment..."
          echo "Commit: $COMMIT_SHA"

          for i in {1..30}; do

            RESPONSE=$(curl -s \
              --request GET \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=10" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "accept: application/json")

            DEPLOY=$(echo "$RESPONSE" | jq -r \
              --arg SHA "$COMMIT_SHA" \
              '.[] | select(.deploy.commit.id == $SHA) | .deploy' | head -c 20000)

            if [ -n "$DEPLOY" ]; then
              STATUS=$(echo "$DEPLOY" | jq -r '.status')
              DEPLOY_ID=$(echo "$DEPLOY" | jq -r '.id')
              COMMIT_MESSAGE=$(echo "$DEPLOY" | jq -r '.commit.message')

              echo "Render status: $STATUS"
              echo "Deploy ID: $DEPLOY_ID"
              echo "Commit message: $COMMIT_MESSAGE"

              if [ "$STATUS" = "live" ]; then
                echo "status=success" >> "$GITHUB_OUTPUT"
                echo "deploy_status=$STATUS" >> "$GITHUB_OUTPUT"
                echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              if [[ "$STATUS" == *"failed"* || "$STATUS" == "canceled" ]]; then
                echo "status=failed" >> "$GITHUB_OUTPUT"
                echo "deploy_status=$STATUS" >> "$GITHUB_OUTPUT"
                echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi

            echo "Deployment still in progress..."
            sleep 20
          done

          echo "status=timeout" >> "$GITHUB_OUTPUT"
          echo "deploy_status=timeout" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ Render Deployment Successful - Tinfox WordPress"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            Tinfox WordPress deployment completed successfully.

            Service:
            tinfox-wordpress-clone-1

            Branch:
            dev

            Commit:
            ${{ github.sha }}

            Commit Message:
            ${{ github.event.head_commit.message }}

            Render Status:
            ${{ steps.render.outputs.deploy_status }}

            Deploy ID:
            ${{ steps.render.outputs.deploy_id }}

            Repository:
            ${{ github.server_url }}/${{ github.repository }}

            Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Render Deployment FAILED - Tinfox WordPress"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            Tinfox WordPress deployment FAILED.

            Service:
            tinfox-wordpress-clone-1

            Branch:
            dev

            Commit:
            ${{ github.sha }}

            Commit Message:
            ${{ github.event.head_commit.message }}

            Render Status:
            ${{ steps.render.outputs.deploy_status }}

            Deploy ID:
            ${{ steps.render.outputs.deploy_id }}

            Repository:
            ${{ github.server_url }}/${{ github.repository }}

            Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please open Render Dashboard → Deploys to inspect the Docker build/deployment logs.
